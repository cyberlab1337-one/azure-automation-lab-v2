# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: CI
    displayName: 'Validate infrastructure'
    jobs:
      - job: Validate
        displayName: 'Build and validate Bicep'
        steps:

          - script: |
              az bicep version
              az bicep build --file deploy.bicep
            displayName: 'Build Bicep'

          - script: |
              az bicep lint --file deploy.bicep
            displayName: 'Lint Bicep'

          - task: AzureCLI@2
            displayName: 'Validate deployment'
            inputs:
              azureSubscription: 'sc-azure-lab-dev'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment sub validate \
                  --location westeurope \
                  --template-file deploy.bicep \
                  --parameters ./parameters/dev.bicepparam

            env:
              SSH_PUBLIC_KEY: $(sshPublicKey)

          - task: AzureCLI@2
            displayName: 'What-if deployment'
            inputs:
              azureSubscription: 'sc-azure-lab-dev'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az deployment sub what-if \
                  --location westeurope \
                  --template-file deploy.bicep \
                  --parameters ./parameters/dev.bicepparam

            env:
              SSH_PUBLIC_KEY: $(sshPublicKey)

  - stage: CD
    displayName: 'Deploy infrastructure'
    dependsOn: CI
    condition: succeeded()

    jobs:
      - deployment: Deploy
        displayName: 'Deploy infrastructure'
        environment: 'lab02-dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Deploy infrastructure'
                  inputs:
                    azureSubscription: 'sc-azure-lab-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az deployment sub create \
                        --name lab02-pipeline-deployment \
                        --location westeurope \
                        --template-file deploy.bicep \
                        --parameters ./parameters/dev.bicepparam

                  env:
                    SSH_PUBLIC_KEY: $(sshPublicKey)